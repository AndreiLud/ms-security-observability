spring.application.name=login-service
server.port=8080

# ---------------------------------------------------------------------------
# Banco de dados H2 em memoria
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:segurancadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# Executa schema.sql (DDL) e data.sql (carga inicial) na subida da aplicacao
spring.sql.init.mode=always

# ---------------------------------------------------------------------------
# Regra de bloqueio: o usuario e bloqueado ao falhar MAIS DE UMA VEZ no login,
# isto e, a partir da 2a tentativa invalida consecutiva
# ---------------------------------------------------------------------------
seguranca.login.max-tentativas=2

# ---------------------------------------------------------------------------
# Actuator / metricas (indicadores) - endpoint do Prometheus
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.java.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# ---------------------------------------------------------------------------
# OPENAPI / Swagger
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.br.com.seguranca.login=DEBUG
