global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'login-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # O login-service executa no host (localhost:8080) e o Prometheus em
      # container, por isso o alvo e host.docker.internal e nao localhost.
      - targets: ['host.docker.internal:8080']
